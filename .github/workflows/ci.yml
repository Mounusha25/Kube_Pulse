name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Agent tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  python:
    name: ML data and drift tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy pytest
      - run: python -m pytest -q tests_py

  go:
    name: Prometheus exporter tests (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubeguard-exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kubeguard-exporter/go.mod
          cache-dependency-path: kubeguard-exporter/go.sum
      - run: go test ./...
