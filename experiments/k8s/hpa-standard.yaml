apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memory-workload-standard
  namespace: kubepulse-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memory-workload
  minReplicas: 1
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 65

