apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-workload-code
  namespace: kubepulse-lab
data:
  server.py: |
    import gc
    import json
    import os
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200); self.end_headers(); self.wfile.write(b"ok"); return
            if not self.path.startswith("/work"):
                self.send_response(404); self.end_headers(); return
            megabytes = int(os.getenv("WORK_MB", "4"))
            hold_seconds = float(os.getenv("HOLD_SECONDS", "1"))
            payload = bytearray(megabytes * 1024 * 1024)
            for offset in range(0, len(payload), 4096): payload[offset] = 1
            time.sleep(hold_seconds)
            del payload; gc.collect()
            body = json.dumps({"allocated_mb": megabytes, "held_seconds": hold_seconds}).encode()
            self.send_response(200); self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
        def log_message(self, *_): pass

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-workload
  namespace: kubepulse-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-workload
  template:
    metadata:
      labels:
        app: memory-workload
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python", "/app/server.py"]
          env:
            - name: WORK_MB
              value: "4"
            - name: HOLD_SECONDS
              value: "1"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: memory-workload-code
---
apiVersion: v1
kind: Service
metadata:
  name: memory-workload
  namespace: kubepulse-lab
spec:
  selector:
    app: memory-workload
  ports:
    - port: 8080
      targetPort: 8080
