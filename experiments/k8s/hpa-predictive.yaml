apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memory-workload-predictive
  namespace: kubepulse-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: memory-workload
  minReplicas: 1
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
  metrics:
    - type: External
      external:
        metric:
          name: kubeguard_predicted_memory_ratio
          selector:
            matchLabels:
              pod: memory-workload-0
        target:
          type: Value
          value: 220m

